# Cómo servir la exportación estática de Next.

# El manifiesto tiene su propio tipo; nginx no lo trae de fábrica y sin él
# algunos navegadores se niegan a instalar la PWA.
types { application/manifest+json webmanifest; }

server {
    # Dos puertos a propósito. El natural para una imagen de nginx es el 80,
    # pero Coolify da por hecho el 3000 en cuanto huele un proyecto de Node, y
    # si el recurso se creó así, el proxy llama al 3000 y se lleva un 502.
    # Escuchando en los dos, da igual cuál tenga configurado.
    listen 80;
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    # Next genera `ruta/index.html`; esta línea es la que hace que recargar una
    # pantalla interna funcione en vez de dar un 404.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Una ruta que no existe debe decir 404, no devolver la página de error con
    # un 200: si no, los buscadores y el service worker se la creen.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # El service worker NO se cachea: si el navegador se quedara con uno viejo,
    # seguiría sirviendo la app anterior después de cada despliegue.
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Lo de _next/static lleva huella en el nombre: no cambia nunca.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Para que Coolify pueda comprobar que la app está viva.
    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;
}
